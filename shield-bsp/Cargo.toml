[package]
name = "shield-bsp"
version = "0.1.0"
edition = "2024"

[features]
rev1 = []

[dependencies]
cortex-m-rt = "0.7.5"
cortex-m-semihosting = "0.5.0"
defmt = "1.0.1"
defmt-rtt = "1.1.0"
embassy-embedded-hal = "0.5.0"
embassy-executor = { version = "0.9.1", features = ["defmt", "arch-cortex-m", "executor-thread"] }
embassy-rp = { version = "0.9.0", features = ["critical-section-impl", "time-driver", "rp235xb", "imagedef-secure-exe", "binary-info", "defmt", "rt"] }
embassy-sync = "0.7.2"
embassy-time = "0.5.0"
heapless = { version = "0.9.2", features = ["defmt"] }
ina219 = { version = "0.2.1", default-features = false, features = ["async", "defmt", "paranoid"] }
panic-probe = { version = "1.0.0", features = ["print-defmt"] }
static_cell = "2.1.1"
